services:
  api-order:
    image: sooyaa1/erp-order-api:v1  # ดึง Image ที่คุณเพิ่ง Push ไป
    container_name: fastapi-order-api
    ports:
      - "8001:8000" # Map ออกมาที่ Port 8001
    environment:
      # เชื่อมต่อไปยัง container ชื่อ postgres-db โดยตรง
      - DATABASE_URL=postgresql://postgres:postgres@postgres-db:5432/hrdb
      - API_KEY=chosy-secret-key-2026
    restart: unless-stopped
    # ตรวจสอบให้แน่ใจว่ารันอยู่ใน network เดียวกับ postgres
    # networks:
    #   - erp-network